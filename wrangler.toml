name = "v2sub"
main = "_worker.js"
compatibility_date = "2026-07-28"
keep_vars = true

[vars]
UUID = "ae4ac58b-2cf9-4054-94eb-2f056244b4f2"
# 让 Worker 先用 DoH 把目标域名解析成 A/AAAA 再拨号（否则域名型目标无法代理）
PRELOAD_RACE_DIAL = "true"
# 临时：开启 Worker 内部调试日志（wrangler tail 可见），排查完请删除
DEBUG = "true"

[[kv_namespaces]]
binding = "KV"
id = "b7af35488be54e348bd0ac22f2577605"

[[routes]]
pattern = "v2sub.ccwu.cc"
custom_domain = true
