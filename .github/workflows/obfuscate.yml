name: 🔐 Obfuscate & Deploy edgetunnel Worker

on:
  schedule:
    # 每天北京时间 24:00（即次日 00:00，UTC 16:00）自动执行
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  obfuscate:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "latest"

      - name: 📦 Install javascript-obfuscator
        run: |
          npm install -g javascript-obfuscator

      - name: ⬇️ Download latest edgetunnel worker
        run: |
          curl -sL -o origin.js \
            "https://raw.githubusercontent.com/cmliu/edgetunnel/main/_worker.js"
          echo "Downloaded origin.js ($(wc -c < origin.js) bytes)"

      - name: 🔐 Obfuscate worker code (TEMP: disabled to isolate obfuscator)
        run: |
          cp origin.js _worker.js
          echo "Using UNOBFUSCATED origin.js as _worker.js ($(wc -c < _worker.js) bytes)"

      - name: ✅ Verify output
        run: |
          if [ ! -s _worker.js ]; then
            echo "❌ _worker.js is empty!"
            exit 1
          fi
          echo "✅ Obfuscation successful"

      - name: 📝 Commit obfuscated code
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: main
          commit_message: "🔐 Auto-obfuscate: update edgetunnel worker [skip ci]"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          file_pattern: "_worker.js origin.js"
          push_options: "--force-with-lease"

      - name: 🚀 Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 deploy
          echo "✅ Deployed to v2sub.ccwu.cc"

      - name: 🔍 Verify deployment
        run: |
          sleep 8
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://v2sub.ccwu.cc/")
          echo "首页伪装页 HTTP: $CODE"
          if [ "$CODE" != "200" ]; then
            echo "❌ 部署验证失败：期望 200，实际 $CODE"
            exit 1
          fi
          echo "✅ 部署验证通过"